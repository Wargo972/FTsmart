<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="ftsmart-api-base" content="https://ftsmart-backend.onrender.com" />
  <title>FTsmart — Recherche d'offres</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header><h1>FTsmart</h1></header>
    <main>
      <div class="form">
        <input id="motsCles" placeholder="mots-clés (ex: développeur java)" />
        <input id="commune" placeholder="commune (code INSEE)" />
        <input id="departement" placeholder="département (ex: 75)" />
        <input id="region" placeholder="région" />
        <input id="typeContrat" placeholder="typeContrat (CDI,CDD)" />
        <input id="experience" placeholder="experience (D/E/S)" />
        <input id="qualification" placeholder="qualification" />
        <input id="skills" placeholder="skills (ex: react,node,sql)" />
        <input id="distance" type="number" placeholder="distance (km)" value="100" />
        <button id="searchBtn">Rechercher</button>
      </div>
      <div id="messages" class="muted"></div>
      <div id="results"></div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
